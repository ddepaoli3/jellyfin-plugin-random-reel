<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Random Reel</title>
    <style>
        #rrMain {
            padding: 2em;
            max-width: 900px;
            margin: 0 auto;
        }
        #rrMain h1 {
            font-size: 1.8em;
            margin-bottom: 0.3em;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }
        #rrMain .rr-subtitle {
            opacity: 0.6;
            margin-bottom: 2em;
            font-size: 0.95em;
        }
        #rrMain .rr-folder-list {
            display: flex;
            flex-direction: column;
            gap: 0.8em;
        }
        #rrMain .rr-folder-btn {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 1em 1.4em;
            border-radius: 6px;
            border: 2px solid transparent;
            background: var(--color-paper, rgba(255,255,255,0.07));
            color: inherit;
            font-size: 1.1em;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s, background 0.15s;
            width: 100%;
        }
        #rrMain .rr-folder-btn:hover,
        #rrMain .rr-folder-btn:focus {
            border-color: var(--color-primary, #00a4dc);
            background: var(--color-primary-dark, rgba(0,164,220,0.15));
            outline: none;
        }
        #rrMain .rr-folder-btn .material-icons {
            font-size: 1.6em;
            opacity: 0.8;
        }
        #rrMain .rr-status {
            margin-top: 1.5em;
            padding: 0.8em 1em;
            border-radius: 4px;
            font-size: 0.9em;
            display: none;
        }
        #rrMain .rr-status.visible { display: block; }
        #rrMain .rr-status.ok { background: rgba(0,200,100,0.15); color: #4caf50; }
        #rrMain .rr-status.err { background: rgba(220,50,50,0.15); color: #ef5350; }
        #rrMain .rr-loading {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="rrMain" data-role="page" class="page type-interior">
        <div data-role="content">
            <div class="content-primary">
                <h1>
                    <span class="material-icons" style="color:var(--color-primary,#00a4dc)">casino</span>
                    Random Reel
                </h1>
                <p class="rr-subtitle">Choose a folder or playlist to start random playback</p>

                <div id="rrFolderList" class="rr-folder-list">
                    <p class="rr-loading">Loading libraries…</p>
                </div>

                <div id="rrStatus" class="rr-status"></div>
            </div>
        </div>

        <script type="text/javascript">
        (function () {
            var PLUGIN_ID = 'a3a23ce9-cf03-4772-b49a-170913d6139a';

            function setStatus(msg, type) {
                var el = document.getElementById('rrStatus');
                el.textContent = msg;
                el.className = 'rr-status visible ' + (type || '');
            }

            function launch(folderId, btnEl) {
                if (btnEl) { btnEl.disabled = true; }
                setStatus('Starting Random Reel…', '');

                // Reuse inject.js logic (duration timer, auto-advance, watch history cleanup)
                if (window.RandomReel && window.RandomReel.launch) {
                    window.RandomReel.launch(folderId);
                    setStatus('Playback started!', 'ok');
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.innerHTML = '<span class="material-icons">casino</span><span>' + btnEl.dataset.name + '</span>';
                    }
                } else {
                    setStatus('Error: inject.js not loaded. Check plugin installation.', 'err');
                    if (btnEl) { btnEl.disabled = false; }
                }
            }

            function renderFolders(items) {
                var list = document.getElementById('rrFolderList');
                if (!items || items.length === 0) {
                    list.innerHTML = '<p>No libraries found.</p>';
                    return;
                }
                list.innerHTML = '';
                items.forEach(function (item) {
                    var btn = document.createElement('button');
                    btn.className = 'rr-folder-btn';
                    btn.dataset.name = item.Name;
                    btn.innerHTML = '<span class="material-icons">casino</span><span>' + item.Name + '</span>';
                    btn.addEventListener('click', function () { launch(item.Id, btn); });
                    list.appendChild(btn);
                });
                // Auto-focus first button for TV remote navigation
                var first = list.querySelector('.rr-folder-btn');
                if (first) first.focus();
            }

            function loadLibraries() {
                var hdrs = authHeaders();
                var userId;
                try { userId = ApiClient.getCurrentUserId(); } catch (e) { /* ignore */ }
                if (!userId) {
                    document.getElementById('rrFolderList').innerHTML = '<p>Not logged in.</p>';
                    return;
                }

                // Fetch top-level user views (libraries) + playlists
                Promise.all([
                    fetch('/Users/' + userId + '/Views', { headers: hdrs }).then(function (r) { return r.json(); }),
                    fetch('/Users/' + userId + '/Items?IncludeItemTypes=Playlist&Recursive=true', { headers: hdrs }).then(function (r) { return r.json(); })
                ]).then(function (results) {
                    var views = (results[0].Items || []).filter(function (v) {
                        return v.CollectionType === 'movies' || v.CollectionType === 'tvshows' ||
                               v.CollectionType === 'mixed' || !v.CollectionType;
                    });
                    var playlists = results[1].Items || [];
                    renderFolders(views.concat(playlists));
                }).catch(function (err) {
                    document.getElementById('rrFolderList').innerHTML = '<p>Error loading libraries: ' + err.message + '</p>';
                });
            }

            document.getElementById('rrMain').addEventListener('pageshow', function () {
                loadLibraries();
            });

            // Keyboard navigation for TV (arrow keys move focus between buttons)
            document.getElementById('rrFolderList').addEventListener('keydown', function (e) {
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                var btns = Array.from(document.querySelectorAll('.rr-folder-btn'));
                var idx = btns.indexOf(document.activeElement);
                if (idx === -1) return;
                e.preventDefault();
                var next = e.key === 'ArrowDown' ? btns[idx + 1] : btns[idx - 1];
                if (next) next.focus();
            });
        })();
        </script>
    </div>
</body>
</html>
