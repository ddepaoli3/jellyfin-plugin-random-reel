<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Random Reel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #101010;
            color: #fff;
            font-family: sans-serif;
            min-height: 100vh;
        }

        /* ── Login screen ── */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1.5em;
            padding: 2em;
        }
        #loginScreen h1 { font-size: 2em; }
        #loginScreen input {
            width: 100%;
            max-width: 400px;
            padding: 0.8em 1em;
            font-size: 1.1em;
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        #loginScreen input:focus { border-color: #00a4dc; }

        /* ── Main screen ── */
        #mainScreen { display: none; padding: 2em; }

        #mainScreen h1 {
            font-size: 1.8em;
            margin-bottom: 0.3em;
            display: flex;
            align-items: center;
            gap: 0.4em;
        }
        #mainScreen .subtitle {
            color: #aaa;
            margin-bottom: 2em;
            font-size: 0.95em;
        }

        /* ── Folder grid ── */
        #folderList {
            display: flex;
            flex-direction: column;
            gap: 0.8em;
            max-width: 700px;
        }

        .folder-btn {
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 1.1em 1.4em;
            background: #1e1e1e;
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: border-color 0.15s, background 0.15s;
        }
        .folder-btn:hover,
        .folder-btn:focus {
            border-color: #00a4dc;
            background: #1a2f3a;
            outline: none;
        }
        .folder-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .folder-btn .icon { font-size: 1.5em; }

        /* ── Status bar ── */
        #status {
            margin-top: 1.5em;
            padding: 0.9em 1.2em;
            border-radius: 8px;
            font-size: 1em;
            display: none;
            max-width: 700px;
        }
        #status.show { display: block; }
        #status.ok  { background: rgba(0,200,100,0.15); color: #4caf50; border: 1px solid #4caf50; }
        #status.err { background: rgba(220,50,50,0.15);  color: #ef5350; border: 1px solid #ef5350; }
        #status.inf { background: rgba(0,164,220,0.15);  color: #00a4dc; border: 1px solid #00a4dc; }

        /* ── TV button (big) ── */
        .btn {
            padding: 0.9em 2em;
            font-size: 1.1em;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            font-weight: bold;
            transition: border-color 0.15s, background 0.15s;
        }
        .btn:focus { outline: none; border-color: #00a4dc; }
        .btn-primary { background: #00a4dc; color: #fff; }
        .btn-primary:hover { background: #0090c0; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-secondary:hover { background: #444; }
    </style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
    <h1>🎲 Random Reel</h1>
    <p style="color:#aaa">Enter your Jellyfin credentials to continue</p>
    <input id="serverUrl" type="url" placeholder="Server URL (e.g. http://192.168.1.10:8096)" />
    <input id="username" type="text" placeholder="Username" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn btn-primary" id="loginBtn" style="width:100%;max-width:400px">Sign In</button>
    <div id="loginStatus" class="btn" style="display:none;background:transparent;color:#ef5350;border:none;font-weight:normal"></div>
</div>

<!-- ── Main ── -->
<div id="mainScreen">
    <h1>🎲 Random Reel</h1>
    <p class="subtitle">Choose a library to start continuous random playback</p>
    <div id="folderList"><p style="color:#aaa">Loading…</p></div>
    <div id="status"></div>
    <div style="margin-top:2em">
        <button class="btn btn-secondary" id="logoutBtn">Sign out</button>
    </div>
</div>

<script>
(function () {
    var STATE_KEY = 'rrtvState';
    var state = {}; // { serverUrl, token, userId, deviceId }

    /* ── Helpers ── */
    function $(id) { return document.getElementById(id); }

    function setStatus(msg, type) {
        var el = $('status');
        el.textContent = msg;
        el.className = 'show ' + (type || 'inf');
    }

    function deviceId() {
        var id = localStorage.getItem('rrDeviceId');
        if (!id) {
            id = 'rrtv-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
            localStorage.setItem('rrDeviceId', id);
        }
        return id;
    }

    function authHeader() {
        var did = deviceId();
        var h = 'MediaBrowser Client="Random Reel TV"' +
                ', Device="TV Browser"' +
                ', DeviceId="' + did + '"' +
                ', Version="1.0.0"';
        if (state.token) h += ', Token="' + state.token + '"';
        return h;
    }

    function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ 'Authorization': authHeader(), 'Content-Type': 'application/json' }, opts.headers || {});
        return fetch(state.serverUrl + path, opts);
    }

    /* ── Persist / restore session ── */
    function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
    function loadState() {
        try { state = JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch (e) { state = {}; }
    }

    /* ── Login ── */
    function login(serverUrl, username, password) {
        state.serverUrl = serverUrl.replace(/\/$/, '');
        var did = deviceId();
        var authNoToken = 'MediaBrowser Client="Random Reel TV", Device="TV Browser", DeviceId="' + did + '", Version="1.0.0"';
        return fetch(state.serverUrl + '/Users/AuthenticateByName', {
            method: 'POST',
            headers: { 'Authorization': authNoToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ Username: username, Pw: password })
        })
        .then(function (r) { if (!r.ok) throw new Error('Login failed (' + r.status + ')'); return r.json(); })
        .then(function (d) {
            state.token  = d.AccessToken;
            state.userId = d.User.Id;
            saveState();
        });
    }

    /* ── Load libraries ── */
    function loadLibraries() {
        $('folderList').innerHTML = '<p style="color:#aaa">Loading…</p>';
        Promise.all([
            api('/Users/' + state.userId + '/Views').then(function (r) { return r.json(); }),
            api('/Users/' + state.userId + '/Items?IncludeItemTypes=Playlist&Recursive=true').then(function (r) { return r.json(); })
        ]).then(function (results) {
            var views = (results[0].Items || []).filter(function (v) {
                return ['movies', 'tvshows', 'mixed', ''].indexOf(v.CollectionType || '') !== -1;
            });
            var playlists = results[1].Items || [];
            renderFolders(views.concat(playlists));
        }).catch(function (e) {
            $('folderList').innerHTML = '<p style="color:#ef5350">Error: ' + e.message + '</p>';
        });
    }

    function renderFolders(items) {
        var list = $('folderList');
        if (!items.length) { list.innerHTML = '<p style="color:#aaa">No libraries found.</p>'; return; }
        list.innerHTML = '';
        items.forEach(function (item) {
            var btn = document.createElement('button');
            btn.className = 'folder-btn';
            btn.innerHTML = '<span class="icon">🎬</span><span>' + item.Name + '</span>';
            btn.addEventListener('click', function () { launch(item.Id, btn); });
            list.appendChild(btn);
        });
        list.querySelector('.folder-btn').focus();
    }

    /* ── Playback ── */
    var rrSession = null; // { itemId, folderId, timer }
    var pendingCleanup = {};

    function getSession() {
        var did = deviceId();
        return api('/Sessions?deviceId=' + encodeURIComponent(did))
            .then(function (r) { return r.json(); })
            .then(function (sessions) {
                for (var i = 0; i < sessions.length; i++) {
                    if (sessions[i].DeviceId === did) return sessions[i];
                }
                return sessions[0] || null;
            });
    }

    function cleanupWatch(itemId) {
        var base = '/Users/' + state.userId + '/PlayedItems/' + itemId;
        api(base, { method: 'POST' })
            .then(function () { return api(base, { method: 'DELETE' }); })
            .catch(function () {});
    }

    function stopTimer() {
        if (rrSession && rrSession.timer) clearTimeout(rrSession.timer);
    }

    function launch(folderId, btnEl) {
        setStatus('Picking a random clip…', 'inf');
        if (btnEl) btnEl.disabled = true;

        api('/RandomReel/Next?folderId=' + encodeURIComponent(folderId))
            .then(function (r) { if (!r.ok) throw new Error('/RandomReel/Next ' + r.status); return r.json(); })
            .then(function (data) {
                var itemId    = data.itemId    || data.ItemId;
                var startTick = data.startPositionTicks || data.StartPositionTicks || 0;
                var durTicks  = data.playbackDurationTicks || data.PlaybackDurationTicks || 0;

                return getSession().then(function (session) {
                    if (!session) throw new Error('No active playback session found.\nOpen Jellyfin on this device first.');
                    var qs = 'playCommand=PlayNow' +
                             '&itemIds=' + encodeURIComponent(itemId) +
                             '&startPositionTicks=' + Math.floor(startTick) +
                             '&mediaSourceId=' + encodeURIComponent(itemId);
                    return api('/Sessions/' + session.Id + '/Playing?' + qs, { method: 'POST' })
                        .then(function (r) { if (!r.ok) throw new Error('Sessions/Playing ' + r.status); })
                        .then(function () {
                            // Set up auto-advance
                            stopTimer();
                            if (rrSession) pendingCleanup[rrSession.itemId] = true;
                            rrSession = { itemId: itemId, folderId: folderId, timer: null };

                            if (durTicks > 0) {
                                var ms = durTicks / 10000;
                                rrSession.timer = setTimeout(function () {
                                    if (!rrSession || rrSession.itemId !== itemId) return;
                                    var prev = rrSession.itemId;
                                    var next = rrSession.folderId;
                                    pendingCleanup[prev] = true;
                                    rrSession = null;
                                    cleanupWatch(prev);
                                    launch(next, null);
                                }, ms);
                            }

                            setStatus('▶ Playing — next clip in ' + Math.round(durTicks / 600000000) + ' min', 'ok');
                        });
                });
            })
            .catch(function (e) { setStatus('Error: ' + e.message, 'err'); })
            .finally(function () { if (btnEl) btnEl.disabled = false; });
    }

    /* ── Arrow-key navigation ── */
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var btns = Array.from(document.querySelectorAll('.folder-btn:not([disabled])'));
        if (!btns.length) return;
        var idx = btns.indexOf(document.activeElement);
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? btns[idx + 1] : btns[idx - 1];
        if (next) next.focus();
    });

    /* ── UI flow ── */
    function showMain() {
        $('loginScreen').style.display = 'none';
        $('mainScreen').style.display  = 'block';
        loadLibraries();
    }

    function showLogin() {
        $('loginScreen').style.display = 'flex';
        $('mainScreen').style.display  = 'none';
    }

    $('loginBtn').addEventListener('click', function () {
        var serverUrl = $('serverUrl').value.trim();
        var username  = $('username').value.trim();
        var password  = $('password').value;
        if (!serverUrl || !username) { $('loginStatus').textContent = 'Fill in all fields.'; $('loginStatus').style.display='block'; return; }
        $('loginBtn').disabled = true;
        $('loginBtn').textContent = 'Signing in…';
        login(serverUrl, username, password)
            .then(showMain)
            .catch(function (e) {
                $('loginStatus').textContent = e.message;
                $('loginStatus').style.display = 'block';
                $('loginBtn').disabled = false;
                $('loginBtn').textContent = 'Sign In';
            });
    });

    $('logoutBtn').addEventListener('click', function () {
        stopTimer();
        rrSession = null;
        state = {};
        localStorage.removeItem(STATE_KEY);
        showLogin();
    });

    // Allow pressing Enter on inputs to submit login
    ['serverUrl','username','password'].forEach(function (id) {
        $(id).addEventListener('keydown', function (e) {
            if (e.key === 'Enter') $('loginBtn').click();
        });
    });

    /* ── Init ── */
    loadState();
    if (state.token && state.userId && state.serverUrl) {
        // Verify token is still valid
        api('/Users/' + state.userId)
            .then(function (r) { if (r.ok) showMain(); else { state = {}; showLogin(); } })
            .catch(function () { showLogin(); });
    } else {
        showLogin();
    }
})();
</script>
</body>
</html>
